[project]
name = "hr-analytics"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "abolfazl abbasi", email = "a.abbasi5775@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "fastapi>=0.110",
    "httpx>=0.27",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "playwright>=1.45",
    "pytest>=8",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "uvicorn>=0.29",
]

[project.scripts]
hr-analytics = "hr_analytics:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
